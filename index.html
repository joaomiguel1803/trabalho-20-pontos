
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inteligência Artificial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🤖 Inteligência Artificial</h1>
    <h2>Medo ou fascínio?</h2>
    <p>A inteligência artificial está transformando o mundo.
    Como você se sente diante dessa tecnologia?</p>

    <section id="inicio">
      <button onclick="comecarQuiz()">Começar o quiz</button>
    </section>

    <section id="quiz" hidden>
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
    </section>

    <section id="resultado" hidden>
      <h2>✨ Seu resultado</h2>
      <p id="mensagem"></p>
      <button onclick="comecarQuiz()">Refazer o quiz</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
